<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Treasury Admin · EmpireBlox</title>
<style>
  :root{color-scheme:dark;--bg:#10161b;--panel:#182026;--panel2:#212c33;--line:#344048;--line2:#52616a;--txt:#edf1f2;--mut:#acb9bf;--acc:#e1c58f;--grn:#a3d9bb;--red:#f3ada7;--gutter:clamp(16px,3vw,44px);--left:max(var(--gutter),env(safe-area-inset-left,0px));--right:max(var(--gutter),env(safe-area-inset-right,0px))}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  /* Keep the shell stable when mobile browser controls appear or retract. */
  html{height:100svh}
  body{margin:0;background:var(--bg);color:var(--txt);font:400 14px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
  a{color:var(--acc)}
  h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.2;font-weight:650;letter-spacing:-.025em}
  h1{font-size:clamp(26px,3vw,34px)}h2,h3{font-size:18px}h2+p,h3+p{margin-top:6px}
  [hidden],.hide{display:none!important}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .mut{color:var(--mut)}.mono{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
  .eyebrow,th{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
  button{font:inherit;font-weight:600;line-height:1.35;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);border-radius:5px;padding:9px 13px;min-height:38px}
  button:not(:disabled):hover{border-color:var(--mut);background:#2b3740}button:not(:disabled):active{border-color:var(--acc)}
  button.pri{background:var(--acc);color:#282319;border-color:var(--acc)}button.pri:not(:disabled):hover{background:#ebd4aa;color:#211e17}
  button.danger{color:var(--red);border-color:#986761}button:disabled{opacity:.5;cursor:default}
  button.sm{min-height:34px;padding:6px 11px;font-size:13px}
  input,select,textarea{font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:5px;padding:9px 10px;width:100%;min-width:0}
  textarea{display:block;resize:vertical;margin:12px 0}input::placeholder,textarea::placeholder{color:#96a5ad}
  label{display:block;font-size:13px;font-weight:550;color:var(--mut)}label input,label select,label+input{margin-top:5px}
  #app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
  .masthead{border-bottom:1px solid var(--line);background:var(--panel);padding-top:env(safe-area-inset-top,0px)}
  .mast-inner,.workspace{width:100%;max-width:1360px;margin-inline:auto;padding-left:var(--left);padding-right:var(--right)}
  .mast-inner{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;align-items:center;gap:18px;padding-block:13px}
  .brand,.identity{display:flex;align-items:center;gap:10px;min-width:0}
  .brand{font-size:17px;font-weight:700;letter-spacing:-.035em}.brand::before{content:'';width:10px;height:10px;flex:none;background:var(--acc);transform:rotate(45deg);margin-inline:2px}
  .product{color:var(--mut);border-left:1px solid var(--line2);padding-left:10px;font-size:14px;font-weight:500;letter-spacing:0}
  .identity{justify-self:end;max-width:100%;color:var(--mut);font-size:13px}.identity #who{overflow-wrap:anywhere}.identity .pill{flex:none}
  .skip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:0;transform:translateY(-160%);z-index:2;background:var(--panel);padding:8px 12px}.skip:focus{top:max(8px,env(safe-area-inset-top,0px));transform:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .workspace{min-height:0;display:grid;grid-template-columns:176px minmax(0,1fr);grid-template-rows:minmax(0,1fr);column-gap:clamp(22px,3vw,44px)}
  #workspaceScroll,.login{min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-padding-block:6px;outline-offset:-2px}
  #workspaceScroll{position:relative;padding:28px 3px max(48px,env(safe-area-inset-bottom,0px))}
  #nav{min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;padding:28px 14px max(16px,env(safe-area-inset-bottom,0px)) 3px;border-right:1px solid var(--line)}
  .nav-group{display:grid;gap:2px}.nav-group+.nav-group{margin-top:20px}.nav-group .eyebrow{padding:3px 9px 5px}
  nav button{background:transparent;border-color:transparent;color:var(--mut);text-align:left}
  nav button.on{background:var(--panel2);color:var(--txt);border-inline-start:3px solid var(--acc)}
  .section-head{border-bottom:1px solid var(--line);padding:0 0 17px;margin-bottom:18px}.section-head .eyebrow{margin:0 0 5px}
  #view,.card,.tscroll{min-width:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:clamp(15px,2vw,23px);margin-bottom:14px}
  .card>p+button,.card>p+.grid2,.card>h2+.row,.withdrawal-review [role=status]:not(:empty),#queueStatus:not(:empty){margin-top:12px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:min(160px,100%)}
  .grid2,.directory-search,.control-form{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .directory-search,.control-form{margin-top:14px;align-items:end}.directory-search{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .control-form{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}.control-form [role=status],.withdrawal-review [role=status]{color:var(--acc)}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.stat{border-top:2px solid var(--line2);padding-top:10px}
  .stat span{font-size:13px;color:var(--mut)}.stat b{display:block;font-size:clamp(20px,2.4vw,30px);font-weight:600;overflow-wrap:anywhere}.stat .ok{color:var(--grn)}.stat .warn{color:var(--acc)}
  .tscroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{background:var(--panel2)}
  tbody tr:last-child td{border:0}td[colspan]{padding:18px 9px}.audit-detail{min-width:18ch;max-width:60ch;overflow-wrap:anywhere}.pill{display:inline-block;vertical-align:middle;white-space:nowrap;font:600 12px/1.6 system-ui;border-radius:4px;padding:1px 7px;background:var(--panel2);color:var(--mut)}
  .pill.ok{color:var(--grn);background:#233b33}.pill.warn{color:var(--acc);background:#3b3428}
  .user-row,.player-heading,.record-pager,.record summary,.record-facts div{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .user-row{width:100%;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;padding:13px 6px;text-align:left}
  .user-row>span:first-child,.player-heading>div,.record summary>span{flex:1;min-width:0;overflow-wrap:anywhere}
  .user-row small,.record small,.player-heading p{display:block;color:var(--mut);font-weight:400;margin-top:3px}
  .player-heading{margin:16px 0}.player-heading h2{font-size:22px}
  #playerTabs{display:flex;gap:3px;overflow-x:auto;padding:3px;margin:0 0 12px}#playerTabs button{flex:none}
  #playerTabs .on{border-inline-start:1px solid transparent;border-bottom:2px solid var(--acc)}
  .record{border-bottom:1px solid var(--line);padding:11px 0}.record summary{cursor:pointer}.record summary::after{content:'+';color:var(--mut)}.record[open] summary::after{content:'−'}
  .record summary>b{max-width:45%;overflow-wrap:anywhere}.record-pager{margin-top:14px;font-size:13px;color:var(--mut)}
  .record-facts{margin:10px 0 18px}.record-facts div{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}.record-facts dt,.withdrawal-review dt{color:var(--mut)}
  .record-facts dd{margin:0;text-align:right;max-width:65%;overflow-wrap:anywhere}.pending-only{display:flex;align-items:center;gap:8px}.pending-only input{width:auto;margin:0}
  .withdrawal-review dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:13px}.withdrawal-review dd{margin:0;overflow-wrap:anywhere}.withdrawal-review .row{margin-top:12px}
  .load-state,.empty-state,.load-error{padding:17px 14px;border-inline-start:2px solid var(--line2);background:var(--panel);color:var(--mut);overflow-wrap:anywhere}
  .load-state{display:flex;align-items:center;gap:10px}.load-state::before{content:'';width:12px;height:12px;flex:none;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%}
  .load-error{border-color:var(--red)}.load-error strong{color:var(--txt)}.load-error button{margin-top:12px}#directoryResults,.card>.empty-state,#playerStats{margin-top:14px}
  .toast{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - var(--left) - var(--right));width:max-content;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line2);border-inline-start:3px solid var(--acc);color:var(--txt);padding:10px 16px;border-radius:5px;z-index:5}.toast:empty{border:0;padding:0}
  .login{height:100%;padding:clamp(24px,12vh,120px) var(--right) max(24px,env(safe-area-inset-bottom,0px)) var(--left);padding-top:max(clamp(24px,12svh,120px),env(safe-area-inset-top,0px))}.login-inner{max-width:420px;margin-inline:auto}.login .brand{margin-bottom:22px}.login .card{padding:clamp(20px,4vw,30px)}.login .eyebrow{margin-bottom:6px}
  .login form{display:grid;gap:16px;margin-top:22px}.login .load-state{margin-top:20px}.login button{width:100%}.login [role=alert]{color:var(--red);overflow-wrap:anywhere}.login [role=alert]:not(:empty){margin-top:12px}
  @keyframes spin{to{transform:rotate(360deg)}}@keyframes reveal{from{opacity:.72;transform:translateY(2px)}}
  @media(prefers-reduced-motion:no-preference){button{transition:background-color .14s,border-color .14s,color .14s}.load-state::before{animation:spin 1s linear infinite}.section-body,.record[open] .record-facts{animation:reveal .16s ease-out}}
  @media(max-width:800px){
    .workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding-inline:0}
    #nav{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;border:0;border-bottom:1px solid var(--line);padding:12px var(--right) 8px var(--left)}
    #workspaceScroll{padding:18px var(--right) max(32px,env(safe-area-inset-bottom,0px)) var(--left)}
    .nav-group{display:flex;flex:none}.nav-group+.nav-group{margin:0;border-left:1px solid var(--line);padding-left:6px}.nav-group .eyebrow{display:none}
    #nav button.on{border-inline-start:1px solid transparent;border-bottom:2px solid var(--acc)}
  }
  @media(max-width:600px){
    .mast-inner{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding-block:9px}.masthead .brand{font-size:16px;gap:8px}.identity{grid-row:2;grid-column:1/-1;justify-self:start}.mast-inner #logout{grid-row:1;grid-column:2}
    .grid2,.directory-search,.control-form{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    button,button.sm{min-height:42px}input,select,textarea{font-size:16px}.section-head{padding-bottom:12px;margin-bottom:14px}
  }
#merchantForm,#providerForm,#limitsForm{display:grid;gap:9px;margin:14px 0}#merchantForm input,#providerForm select{max-width:540px}#merchantForm button,#providerForm button,#limitsForm button{justify-self:start;min-height:38px}#limitsForm .grid2{max-width:600px}#limitsForm label{margin:0}#limitsForm input{margin-top:4px}#providerForm+.row{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
</style>
<link rel="stylesheet" href="/admin/option-picker.css">
<script defer src="/admin/option-picker.js"></script>
</head>
<body>

<!-- LOGIN -->
<main id="login" class="login" aria-labelledby="loginTitle" tabindex="0">
  <div class="login-inner">
    <div class="brand">EmpireBlox <span class="product">Treasury</span></div>
    <section class="card">
      <p class="eyebrow">Restricted access</p>
      <h1 id="loginTitle">Operator sign-in</h1>
      <p class="mut">Use your treasury operator credentials.</p>
      <p id="sessionCheck" class="load-state" role="status">Checking your session…</p>
      <form id="loginForm" method="post" hidden>
        <label>Operator username<input id="l_user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
        <label>Password<input id="l_pass" name="password" type="password" autocomplete="current-password" required></label>
        <label id="l_totp_wrap" hidden>Authenticator code<input id="l_totp" name="totp" inputmode="numeric" autocomplete="one-time-code"></label>
        <button class="pri" id="l_btn" type="submit">Sign in</button>
      </form>
      <p id="l_err" role="alert"></p>
    </section>
  </div>
</main>

<!-- APP -->
<div id="app" class="hide">
  <a class="skip" href="#sectionTitle">Skip to section</a>
  <header class="masthead">
    <div class="mast-inner">
      <div class="brand">EmpireBlox <span class="product">Treasury</span></div>
      <div class="identity"><span id="who"></span><span class="pill" id="factor"></span></div>
      <button class="sm" id="logout">Log out</button>
    </div>
  </header>
  <div class="workspace">
    <nav id="nav" aria-label="Treasury sections">
      <div class="nav-group"><span class="eyebrow">Operations</span><button>Overview</button><button>Users</button><button>Withdrawals</button><button>Deposits</button></div>
      <div class="nav-group"><span class="eyebrow">Configuration</span><button>Secrets</button><button>Chains</button><button>Assets</button><button>Settings</button></div>
      <div class="nav-group"><span class="eyebrow">Oversight</span><button>Security</button><button>Audit</button></div>
    </nav>
    <main id="workspaceScroll" aria-labelledby="sectionTitle" tabindex="0">
      <header class="section-head"><p class="eyebrow" id="sectionGroup"></p><h1 id="sectionTitle" tabindex="-1">Overview</h1></header>
      <p id="sectionStatus" class="sr-only" role="status"></p>
      <div id="view"></div>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
let toastT, session=0;
function toast(msg,ms=3500){const t=$('#toast');t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.textContent='',ms);}

async function api(path, method='GET', body){
  const started=session;
  const r = await fetch(path, {
    method, credentials:'include',
    headers: body ? {'content-type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {}; try { data = await r.json(); } catch(e){}
  if(!r.ok){
    if(r.status===401 && started===session && !$('#app').classList.contains('hide')) showLogin('Your session expired. Sign in again.');
    // A proxy error for a credential write can contain the submitted value.
    if(path==='/api/admin/secrets' && method==='PUT'){
      const message=r.status===409?'The merchant key is still needed for outstanding invoices. Pause new deposits and reconcile them before replacing it.':r.status===400?'The secret was not saved. Check the name and value; receiving keys must be watch-only.':'The secret could not be saved. Try again.';
      throw Object.assign(new Error(message),{status:r.status});
    }
    throw Object.assign(new Error(data.error || ('Error '+r.status)),{status:r.status});
  }
  return data;
}

function showLogin(message=''){
  ++session;++userEpoch;clearTimeout(queueTimer);clearTimeout(searchTimer);clearTimeout(toastT);
  current='Overview';adminName='';playerId='';searchText='';directoryPage=recordsPage=queuePage=0;
  playerStatus=transactionType='all';pendingOnly=false;queueScope='open';
  $('#view').replaceChildren();$('#sectionStatus').textContent='';$('#who').textContent='';$('#toast').textContent='';
  $('#l_pass').value='';$('#l_totp').value='';$('#l_totp').required=false;$('#l_totp_wrap').hidden=true;
  $('#sessionCheck').hidden=true;$('#loginForm').hidden=false;$('#l_err').textContent=message;
  $('#app').classList.add('hide');$('#login').classList.remove('hide');document.title='Operator sign-in · EmpireBlox Treasury';
  $('#l_user').focus();
}

// ---- Login ----
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const button=$('#l_btn');if(button.disabled)return;
  button.disabled=true;button.textContent='Signing in…';
  $('#l_err').textContent='';
  try{
    const body = { username:$('#l_user').value.trim(), password:$('#l_pass').value };
    const totp = $('#l_totp').value.trim(); if(totp) body.totp = totp;
    const res = await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const data = await res.json();
    if(!res.ok){
      if(data.need2fa){$('#l_totp_wrap').hidden=false;$('#l_totp').required=true;$('#l_totp').focus();return;}
      $('#l_err').textContent = data.error || 'Login failed'; return;
    }
    await boot(true);
  }catch(e){ $('#l_err').textContent = 'Could not sign in. '+e.message; }
  finally{button.disabled=false;button.textContent='Sign in';}
};
$('#l_user').oninput=()=>{$('#l_totp_wrap').hidden=true;$('#l_totp').required=false;$('#l_totp').value='';};
$('#logout').onclick = async () => {
  const button=$('#logout'),started=session;button.disabled=true;
  try{await api('/api/admin/logout','POST');if(started===session)showLogin();}
  catch(e){if(started===session)toast('Could not log out. '+e.message);}
  finally{button.disabled=false;}
};

// ---- Nav ----
const sections={Overview:renderOverview,Users:renderUsers,Withdrawals:renderWithdrawals,Deposits:renderDeposits,
  Secrets:renderSecrets,Chains:renderChains,Assets:renderAssets,Settings:renderSettings,Security:renderSecurity,Audit:renderAudit};
let current = 'Overview', adminName = '';
function markCurrent(nav,name){
  for(const b of nav.querySelectorAll('button')){
    const selected=b.textContent===name;
    b.classList.toggle('on',selected);
    if(selected)b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  }
}
function openSection(name){
  current=name;
  markCurrent($('#nav'),current);$('#sectionGroup').textContent=$('#nav .on').parentElement.firstElementChild.textContent;
  $('#sectionTitle').textContent=current;document.title=current+' · EmpireBlox Treasury';
  render();$('#workspaceScroll').scrollTop=0;$('#nav .on').scrollIntoView({block:'nearest',inline:'nearest'});
}
$('#nav').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.textContent==='Users'){playerId='';directoryPage=0;}
  openSection(b.textContent);
};
document.addEventListener('keydown',e=>{
  const nav=e.target.closest('nav');if(!nav||e.target.tagName!=='BUTTON'||e.altKey||e.ctrlKey||e.metaKey)return;
  const buttons=[...nav.querySelectorAll('button')],index=buttons.indexOf(e.target);
  const next={ArrowLeft:index-1,ArrowRight:index+1,Home:0,End:buttons.length-1};
  if(nav.id==='nav' && !matchMedia('(max-width:800px)').matches){next.ArrowUp=index-1;next.ArrowDown=index+1;}
  if(Object.hasOwn(next,e.key)){e.preventDefault();buttons[Math.max(0,Math.min(next[e.key],buttons.length-1))].focus();}
});

const fmt = (amt, dec) => { // integer minor units -> human string
  try{const n=BigInt(amt),abs=n<0n?-n:n,base=10n**BigInt(dec||0);
    const frac=(abs%base).toString().padStart(Number(dec),'0').replace(/0+$/,'');
    return (n<0n?'−':'')+(abs/base).toString()+(frac?'.'+frac:'');
  }catch{return amt;}
};
const short = s => s? (s.length>18?s.slice(0,8)+'…'+s.slice(-6):s) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loading=label=>`<p role="status" class="load-state">Loading ${esc(label)}…</p>`;
function loadError(host,label,error,retry){
  if(!host.isConnected)return;
  $('#sectionStatus').textContent='';
  host.innerHTML=`<div class="load-error"><div role="alert"><strong>Could not load ${esc(label)}.</strong><p>${esc(error.message)}</p></div><button type="button" data-retry>Try again</button></div>`;
  host.querySelector('[data-retry]').onclick=retry;
}
async function updateControl(control,send,success,refresh=true){
  if(control.disabled)return;
  const feedback=control.form?.querySelector('[data-save-error]');if(feedback)feedback.textContent='';
  control.disabled=true;
  try{
    const result=await send();if(!control.isConnected)return;
    toast(typeof success==='function'?success(result):success);if(refresh)render();
  }catch(e){if(control.isConnected){if(feedback)feedback.textContent=e.message;toast(e.message,6000);}}
  finally{control.disabled=false;}
}

async function render(){
  clearTimeout(searchTimer);clearTimeout(queueTimer);++userEpoch;
  const view=$('#view'),v=document.createElement('div'),label=current.toLowerCase();
  // Each navigation owns its response target, including its error and completion states.
  if(view.contains(document.activeElement))$('#sectionTitle').focus({preventScroll:true});
  v.className='section-body';view.replaceChildren(v);view.setAttribute('aria-busy','true');
  $('#sectionStatus').textContent='Loading '+label+'…';v.innerHTML=loading(label);
  try{await sections[current](v);if(v.isConnected && current!=='Users')$('#sectionStatus').textContent=current+' loaded.';}
  catch(e){loadError(v,label,e,render);}
  finally{if(v.isConnected)view.setAttribute('aria-busy','false');}
}

async function renderOverview(v){
  const d = await api('/api/admin/overview');
  if(!v.isConnected)return;
  v.innerHTML = `
    <div class="card"><div class="stats">
      <div class="stat"><span>Deposit provider</span><b>${d.deposit_provider==='direct'?'Direct wallet':'OxaPay'}</b></div>
      <div class="stat"><span>Payments in progress</span><b>${esc(d.pending)}</b></div>
      <div class="stat"><span>Assets credited</span><b>${d.credited.length}</b></div>

let queueScope='open',queuePage=0,queueTimer;
async function renderWithdrawals(v, data){
  const path='/api/admin/withdrawals?scope='+queueScope+'&page='+queuePage;
  const {rows,more}=data||await api(path);
  if(!v.isConnected || current!=='Withdrawals')return;
  v.innerHTML=`<div class="card"><h2>${queueScope==='open'?'Withdrawal queue':'Completed withdrawals'}</h2><p class="mut">Review the destination and amount, approve the request, then record the transaction after broadcasting.</p><button id="queueMode"></button> <button id="refreshWithdrawals">Refresh</button><p id="queueStatus" class="mut" role="status"></p></div>`;
  for(const w of rows){
    const own=w.reviewer===adminName;
    v.insertAdjacentHTML('beforeend',`<section class="card withdrawal-review" data-id="${esc(w.id)}">
      <h3>${esc(fmt(w.amount,w.decimals))} ${esc(w.symbol)} <span class="pill">${esc(w.chain_id)}</span></h3>
      <p class="mut"><span class="pill ${w.status==='sent'?'ok':queueScope==='open'?'warn':'off'}">${esc(w.status)}</span> · ${esc(new Date(w.created_at).toLocaleString())}${w.reviewer?' · '+esc(w.reviewer):''}</p>
      <dl><dt>Destination</dt><dd class="mono">${esc(w.destination)}</dd><dt>Request</dt><dd class="mono">${esc(w.id)}</dd><dt>Player</dt><dd><button data-owner="${esc(w.user_id)}">${esc(w.username)}</button> · ${esc(w.email)}</dd><dt>Player ID</dt><dd class="mono">${esc(w.user_id)}</dd>${w.txid?`<dt>Transaction ID</dt><dd class="mono">${esc(w.txid)}</dd>`:''}</dl>
      ${w.status==='requested'?'<button class="pri" data-w="review">Claim for review</button>':own && w.status==='reviewing'?'<button class="pri" data-w="approve">Approve withdrawal</button> <button data-w="return">Return funds to player</button>':own && w.status==='approved'?`<label>Broadcast transaction ID<input name="txid" autocomplete="off" spellcheck="false" maxlength="100"></label>
      <div class="row"><button class="pri" data-w="sent">Record as sent</button><button data-w="return">Return funds to player</button></div>`:''}
      <p class="mut" role="status"></p></section>`);
  }
  if(!rows.length)v.insertAdjacentHTML('beforeend','<p class="empty-state">'+(queueScope==='open'?'No withdrawals awaiting review.':'No completed withdrawals.')+'</p>');
  $('#queueMode').textContent=queueScope==='open'?'View completed withdrawals':'View open requests';
  $('#queueMode').onclick=()=>{queueScope=queueScope==='open'?'history':'open';queuePage=0;render();};
  v.insertAdjacentHTML('beforeend',pageButtons(queuePage,more));
  v.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{queuePage+=Number(b.dataset.step);render();});
  v.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{playerId=b.dataset.owner;playerTab='Overview';openSection('Users');});
  $('#refreshWithdrawals').onclick=render;
  const previous=JSON.stringify({rows,more}),queueStatus=v.querySelector('#queueStatus');
  async function watchQueue(){
    if(!v.isConnected)return;
    try{
      if(!document.hidden){
        const next=await api(path);
        if(!v.isConnected)return;
        if(queueStatus.textContent)queueStatus.textContent='';
        if(JSON.stringify(next)!==previous){
          const drafts=new Map([...v.querySelectorAll('[name=txid]')].map(f=>[f.closest('[data-id]').dataset.id,f.value]));
          const focused=document.activeElement?.closest('[name=txid]')?.closest('[data-id]')?.dataset.id;
          await renderWithdrawals(v,next);
          v.querySelectorAll('[name=txid]').forEach(f=>{
            const id=f.closest('[data-id]').dataset.id;
            if(drafts.has(id))f.value=drafts.get(id);
            if(id===focused)f.focus({preventScroll:true});
          });
          return;
        }
      }
    }catch{if(v.isConnected && !queueStatus.textContent)queueStatus.textContent='Refresh failed. Showing the last received queue; retrying automatically.';}
    if(v.isConnected)queueTimer=setTimeout(watchQueue,4000);
  }
  queueTimer=setTimeout(watchQueue,4000);
  for(const card of v.querySelectorAll('.withdrawal-review')){
    card.onclick=async e=>{
      const button=e.target.closest('[data-w]');
      if(!button)return;
      const action=button.dataset.w, txid=card.querySelector('[name=txid]')?.value.trim();
      const status=card.querySelector('[role=status]');
      if(action==='sent' && !txid){status.textContent='Enter the transaction ID from the sending wallet.';return;}
      if(action==='return' && !confirm('Return this reserved amount to the player?'))return;
      if(action==='sent' && !confirm('Record the broadcast transaction and settle this withdrawal?'))return;
      button.disabled=true;
      try{await api('/api/admin/withdrawals/'+card.dataset.id,'POST',{action,txid:action==='sent'?txid:undefined});if(v.isConnected)await render();}
      catch(err){status.textContent=err.message;button.disabled=false;}
    };
  }
}

let playerId='',playerTab='Overview',directoryPage=0,recordsPage=0,searchText='',playerStatus='all',pendingOnly=false,userEpoch=0;

    const host=v.querySelector('#directoryResults');
    function search(delay=0){
      const turn=++userEpoch;clearTimeout(searchTimer);
      if(host.contains(document.activeElement))host.focus({preventScroll:true});
      if(!host.querySelector('.load-state')){host.setAttribute('aria-busy','true');host.innerHTML=loading('users');$('#sectionStatus').textContent='Searching the directory…';}
      async function fetchRows(){
        try{
          const d=await api('/api/admin/users?'+new URLSearchParams({q:searchText,status:playerStatus,page:String(directoryPage)}));
          if(turn!==userEpoch)return;
          host.innerHTML=(d.rows.map(u=>`<button class="user-row" data-player="${esc(u.id)}"><span><b>${esc(u.username)}</b><small>${esc(u.email)}</small></span><span class="pill ${u.status==='active'?'ok':'warn'}">${esc(u.status)}</span><span aria-hidden="true">›</span></button>`).join('')||'<p class="empty-state">No matching users.</p>')+pageButtons(directoryPage,d.more);

      }
      if(delay)searchTimer=setTimeout(fetchRows,delay);else fetchRows();

    host.onclick=e=>{const item=e.target.closest('[data-player]'),step=e.target.closest('[data-step]');if(item){playerId=item.dataset.player;playerTab='Overview';recordsPage=0;render();}else if(step){directoryPage+=Number(step.dataset.step);search();}};

  const root=playerPath();
  v.innerHTML=`<button class="sm" id="backUsers">← All users</button><header class="player-heading"><div><h2>Player record</h2><p></p></div><span class="pill" hidden></span></header>

  const tabs=v.querySelector('#playerTabs'),host=v.querySelector('#playerRecord');
  async function loadTab(){

    try{

      heading.querySelector('h2').textContent=d.user.username;heading.querySelector('p').textContent=d.user.email;
      badge.hidden=false;badge.textContent=d.user.status;badge.className='pill '+(d.user.status==='active'?'ok':'warn');

      }catch(err){if(n===statSeq && seq===userEpoch)loadError(el,'statistics',err,load);}
    };
    $('#playerStatAsset').onchange=$('#playerStatDays').onchange=load;return load();
  }
  const key=playerTab==='Audit'?'actions':playerTab.toLowerCase();
  const records=await api(root+'/'+key+'?page='+recordsPage+(key==='deposits'?'&pending='+pendingOnly:key==='transactions'?'&type='+transactionType:''));
  if(seq!==userEpoch||current!=='Users')return;
  host.innerHTML=`<h3>${playerTab}</h3>`+(key==='transactions'?`<label>Transaction type<select id="adminTransactionType">${Object.entries({all:'All transactions',deposits:'Deposits',withdrawals:'Withdrawals',bets:'Bets',rewards:'Rewards',adjustments:'Balance adjustments'}).map(([value,label])=>`<option value="${value}" ${transactionType===value?'selected':''}>${label}</option>`).join('')}</select></label>`:'')+(key==='deposits'?`<label class="pending-only"><input type="checkbox" id="pendingDeposits" ${pendingOnly?'checked':''}> Pending confirmations or credit</label>`:'')+(records.rows.map((r,i)=>{
    const time=when(r.created_at||r.first_seen_at);
    const amt=r.amount??r.delta??r.stake, quantity=amt==null?'':fmt(amt,r.decimals)+' '+r.symbol;
    const label=r.game||r.kind||r.action||(r.provider==='oxapay'?'OxaPay invoice':r.chain_id);
    return `<details class="record"><summary><span><b>${esc(label)}</b><small>${esc(time)} · ${esc(r.status||r.withdrawal_status||'')}</small></span><b>${esc(quantity)}</b></summary>
      ${facts([['ID',r.id],['Reference',r.ref||r.track_id],['Status',r.status],['Network',r.chain_id],['Destination',r.address||r.destination],['Transaction ID',r.txid],['Confirmations',r.required_conf!=null?r.confirmations+' / '+r.required_conf:null],['Credit held',r.review_hold!=null?(r.review_hold?'Yes':'No'):null],['Payout',r.payout!=null?fmt(r.payout,r.decimals):null],['Reviewer',r.reviewer],['Operator',r.actor],['Reason',r.reason],['Details',r.details?JSON.stringify(r.details):null],['Journal',r.journal_id]])}
      ${key==='bets'?`<button class="sm" data-bet-detail="${i}">View game result</button><div class="game-facts"></div>`:''}
      ${key==='deposits'&&r.provider==='direct'&&['pending','confirmed'].includes(r.status)?`<form class="control-form" data-deposit-action><input type="hidden" name="deposit" value="${esc(r.id)}"><input type="hidden" name="action" value="${r.review_hold?'release_deposit':'hold_deposit'}"><label>Review reason<input required name="reason" maxlength="300"></label><button>${r.review_hold?'Release review hold':'Hold credit for review'}</button><p role="status"></p></form>`:''}</details>`;
  }).join('')||`<p class="empty-state" role="status">No ${key==='actions'?'audit entries':key} for this selection.</p>`)+pageButtons(recordsPage,records.more);
  if($('#adminTransactionType'))$('#adminTransactionType').onchange=e=>{transactionType=e.target.value;recordsPage=0;loadTab();};
  if($('#pendingDeposits'))$('#pendingDeposits').onchange=e=>{pendingOnly=e.target.checked;recordsPage=0;loadTab();};
  host.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{recordsPage+=Number(b.dataset.step);loadTab();});
  host.querySelectorAll('[data-deposit-action]').forEach(f=>wireControl(f,root,u.username));
  host.querySelectorAll('[data-bet-detail]').forEach(b=>b.onclick=async()=>{const row=records.rows[Number(b.dataset.betDetail)],el=b.nextElementSibling;
    try{const bet=await api(root+'/bets/'+encodeURIComponent(row.game)+'/'+encodeURIComponent(row.id));el.innerHTML=facts(Object.entries(bet.detail).map(([k,v])=>[k,typeof v==='object'&&v!==null?JSON.stringify(v):v]));b.hidden=true;}catch(err){el.textContent=err.message;}});
}
function operationId(){
  const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
}
function wireControl(form,root,name){
  let request=operationId();
  form.oninput=()=>{request=operationId();};
  form.onsubmit=async e=>{
    e.preventDefault();const values=Object.fromEntries(new FormData(form)),status=form.querySelector('[role=status]');
    if(values.until)values.until=new Date(values.until).toISOString();
    const info=[values.action,name,values.amount,values.asset,values.until,values.deposit,values.reason].filter(Boolean).join(' · ');
    if(!confirm('Confirm this change?\n'+info))return;
    const button=form.querySelector('button');button.disabled=true;
    try{await api(root+'/actions','POST',{...values,request});if(form.isConnected){toast('Change recorded');await render();}}
    catch(err){status.textContent=err.message;button.disabled=false;}
  };
}

async function renderSettings(v){
  const [d,limits] = await Promise.all([api('/api/admin/settings'),api('/api/admin/bet-limits')]);
  if(!v.isConnected)return;
  const paused=d.deposits_paused;
  v.innerHTML=`<section class="card"><h2>OxaPay checkout</h2><p class="mut">Players enter an amount in their playing currency. OxaPay hosts checkout; the treasury credits only verified payments.</p>
    <form id="merchantForm"><label for="merchantKey">Merchant API key <span class="pill ${d.merchant_configured?'ok':'warn'}">${d.merchant_configured?'Configured':'Not set'}</span></label>
      <input id="merchantKey" type="password" required autocomplete="new-password" maxlength="512" placeholder="${d.merchant_configured?'Enter a replacement key':'Enter your OxaPay merchant key'}"><div style="margin-top:10px"><button class="pri">Save merchant key</button></div></form>
    <p class="mut">${d.public_origin?'Callback URL: <span class="mono">'+esc(d.public_origin)+'/api/oxapay/webhook</span>':'Deployment setup needed: set PUBLIC_SITE_ORIGIN to the public HTTPS site serving this treasury.'}</p></section>
    <section class="card"><h2>Deposit method</h2><form id="providerForm"><label for="provider">Accept new deposits through</label><select id="provider"><option value="oxapay" ${d.deposit_provider==='oxapay'?'selected':''}>OxaPay hosted checkout</option><option value="direct" ${d.deposit_provider==='direct'?'selected':''}>Direct wallet addresses</option></select><button type="submit">Save method</button></form>
    <div class="row"><div><span class="pill ${paused||d.deposit_provider==='oxapay'&&!d.oxapay_ready?'warn':'ok'}">${paused?'Paused':d.deposit_provider==='oxapay'&&!d.oxapay_ready?'Setup needed':'New deposits enabled'}</span><p class="mut">Pausing stops new invoices and address requests. Previously issued payments can still confirm and credit.</p></div>
    <div style="flex:0 0 auto"><button class="${paused?'pri':'danger'}" id="pauseBtn">${paused?'Resume deposits':'Pause deposits'}</button></div></div></section>
    <section class="card"><h2>Wager limits</h2><p class="mut">Limits apply across paid games in USDT at the market rate when a stake is accepted. Additional stakes count toward the maximum for the hand.</p>
      <form id="limitsForm"><div class="grid2"><label>Minimum bet (USDT)<input name="minimum" inputmode="decimal" required value="${esc(limits.min_usdt)}"></label>
      <label>Maximum bet (USDT)<input name="maximum" inputmode="decimal" value="${esc(limits.max_usdt??'')}" placeholder="No maximum"></label></div><button type="submit" class="pri">Save wager limits</button><span role="status" class="warn" data-save-error></span></form></section>`;
  $('#merchantForm').onsubmit=e=>{e.preventDefault();const key=$('#merchantKey');updateControl(e.target.querySelector('button'),async()=>{await api('/api/admin/secrets','PUT',{name:'oxapay:merchant',value:key.value.trim()});key.value='';},'Merchant key saved');};
  $('#providerForm').onsubmit=e=>{e.preventDefault();updateControl(e.target.querySelector('button'),()=>api('/api/admin/settings','PATCH',{key:'deposit_provider',value:$('#provider').value}),'Deposit method updated');};
  $('#pauseBtn').onclick=e=>updateControl(e.currentTarget,()=>api('/api/admin/settings','PATCH',{key:'deposits_paused',value:!paused}),paused?'Deposits resumed':'New deposits paused');
  $('#limitsForm').onsubmit=e=>{e.preventDefault();const f=e.target;updateControl(f.querySelector('button'),()=>api('/api/admin/bet-limits','PUT',{min_usdt:f.elements.minimum.value.trim(),max_usdt:f.elements.maximum.value.trim()||null}),'Wager limits saved');};
}

function showFactor(enabled){const badge=$('#factor');badge.textContent=enabled?'2FA on':'2FA off';badge.className='pill '+(enabled?'ok':'warn');}
async function renderSecurity(v){
  const me = await api('/api/admin/me');
  if(!v.isConnected)return;
  showFactor(me.totp_enabled);
  v.innerHTML = `<div class="card"><h2>Two-factor authentication</h2>
    <p class="mut">Authenticator verification is ${me.totp_enabled?'<span class="pill ok">enabled</span>':'<span class="pill warn">not enabled</span>'} for this operator.</p>
    ${me.totp_enabled?'':`<button class="pri" id="setup2fa">Set up 2FA</button><div id="s2fa" style="margin-top:12px"></div>`}
  </div>`;
  if(!me.totp_enabled) $('#setup2fa').onclick = async e => {
    const button=e.currentTarget;button.disabled=true;
    let d;
    try{d=await api('/api/admin/2fa/setup','POST');}
    catch(err){if(v.isConnected)toast(err.message,6000);return;}
    finally{button.disabled=false;}
    if(!v.isConnected)return;
    $('#s2fa').innerHTML = `<div class="card" style="background:var(--panel2)">
      <p class="mut" style="font-size:13px">Add this to your authenticator app, then enter a code to confirm.</p>
      <p><b>Secret:</b> <span class="mono">${esc(d.secret)}</span></p>
      <p class="mono mut" style="word-break:break-all;font-size:11px">${esc(d.uri)}</p>
      <div class="row" style="align-items:flex-end"><div style="flex:1"><label for="en_totp">Code</label><input id="en_totp" inputmode="numeric" autocomplete="one-time-code"></div><div style="flex:0 0 auto"><button class="pri" id="en_btn">Enable</button></div></div>
    </div>`;
    $('#en_totp').focus();
    $('#en_btn').onclick=e=>updateControl(e.currentTarget,()=>api('/api/admin/2fa/enable','POST',{totp:$('#en_totp').value.trim()}),'2FA enabled');
  };
}

async function renderAudit(v){
  const d = await api('/api/admin/audit');
  if(!v.isConnected)return;
  v.innerHTML = `<div class="card"><h2>Audit log</h2><div class="tscroll" tabindex="0" role="region" aria-label="Audit log"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th><th>IP</th></tr></thead><tbody>
    ${d.audit.map(a=>`<tr><td class="mut">${new Date(a.created_at).toLocaleString()}</td><td>${esc(a.actor)}</td><td class="mono">${esc(a.action)}</td><td class="mono mut audit-detail">${esc(JSON.stringify(a.detail))}</td><td class="mono mut">${esc(a.ip||'')}</td></tr>`).join('')||'<tr><td colspan=5 class=mut>No audit entries yet.</td></tr>'}
  </tbody></table></div></div>`;
}

async function boot(fromLogin=false){
  try{
    const me = await api('/api/admin/me');
    ++session;adminName=me.username;$('#who').textContent=me.username;showFactor(me.totp_enabled);
    $('#l_pass').value='';$('#l_totp').value='';$('#login').classList.add('hide');$('#app').classList.remove('hide');
    openSection(current);if(fromLogin)$('#nav .on').focus();
  }catch(e){showLogin(e.status===401&&!fromLogin?'':'Could not verify your session. '+e.message);}
}
boot();
</script>
