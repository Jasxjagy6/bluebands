<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Treasury Admin · BANDITBLOX</title>
<style>
  :root{color-scheme:dark;--bg:#10151b;--panel:#181f27;--panel2:#202a34;--line:#303a45;--line2:#526271;--txt:#e5ebf1;--mut:#91a0af;--acc:#c8ad7f;--grn:#a1cdb9;--red:#e4a5a5;--focus:#8396a9;--gutter:clamp(16px,3vw,40px);--left:max(var(--gutter),env(safe-area-inset-left,0px));--right:max(var(--gutter),env(safe-area-inset-right,0px))}
  *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  /* Keep the shell stable when mobile browser controls appear or retract. */
  html{height:100svh}
  body{margin:0;background:var(--bg);color:var(--txt);font:400 14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
  ::selection{background:#354657;color:#fff}
  a{color:var(--acc);text-underline-offset:3px}
  h1,h2,h3,p{margin:0}
  h1,h2,h3{line-height:1.3;font-weight:650;letter-spacing:-.025em;overflow-wrap:anywhere}
  h1{font-size:clamp(24px,2.5vw,30px)}
  h2{font-size:17px}h3{font-size:15px}
  h2+p,h3+p{margin-top:7px}
  [hidden],.hide{display:none!important}
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px}
  :focus:not(:focus-visible){outline:none}
  #workspaceScroll:focus,.login:focus,#sectionTitle:focus,#directoryResults:focus,#playerRecord:focus{outline:none}
  .mut{color:var(--mut)}
  .mono{font:12px/1.6 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-variant-numeric:lining-nums tabular-nums}
  .eyebrow,th{font-size:10px;font-weight:650;letter-spacing:.085em;text-transform:uppercase;color:var(--mut)}

  button{font:inherit;font-size:13px;font-weight:600;line-height:1.35;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);border-radius:5px;padding:9px 13px;min-height:38px;max-width:100%;overflow-wrap:anywhere;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:not(:disabled):hover{border-color:#718291;background:#293541}
  button:not(:disabled):active{background:#313f4c;border-color:var(--focus)}
  button.pri{background:var(--acc);color:#1b2026;border-color:var(--acc)}
  button.pri:not(:disabled):hover{background:#d5bf99;border-color:#d5bf99;color:#151a20}
  button.pri:not(:disabled):active{background:#baa078;border-color:#baa078}
  button.danger{color:var(--red);border-color:#805759;background:#2b232a}
  button.danger:not(:disabled):hover{border-color:#b27b7f;background:#392930}
  button:disabled{opacity:.6;cursor:not-allowed}
  button.sm{min-height:32px;padding:6px 10px;font-size:12px}
  input,select,textarea{font:inherit;font-size:14px;line-height:1.5;background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:5px;padding:9px 11px;width:100%;min-width:0;min-height:40px;box-shadow:none;transition:none;animation:none;accent-color:var(--focus);caret-color:var(--txt)}
  input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:1px;box-shadow:none;transition:none;animation:none}
  input:disabled,select:disabled,textarea:disabled{color:var(--mut);background:var(--panel2);border-color:var(--line);cursor:not-allowed;opacity:.75}
  input::placeholder,textarea::placeholder{color:#7f90a1;opacity:1}
  input[type=checkbox],input[type=radio]{width:16px;height:16px;min-height:0;padding:0;flex:none;vertical-align:middle}
  input[type=search]{appearance:none;-webkit-appearance:none}
  textarea{display:block;resize:vertical;min-height:104px;margin:14px 0}
  label{display:block;font-size:12px;font-weight:550;line-height:1.5;color:var(--mut);min-width:0}
  label input,label select,label+input,label+select{margin-top:6px}
  label .pill{margin-inline-start:6px}

  #app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
  .masthead{border-bottom:1px solid var(--line);background:var(--panel);padding-top:env(safe-area-inset-top,0px)}
  .mast-inner,.workspace{width:100%;max-width:1440px;margin-inline:auto;padding-left:var(--left);padding-right:var(--right)}
  .mast-inner{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;align-items:center;gap:20px;min-height:64px;padding-block:12px}
  .brand,.identity{display:flex;align-items:center;gap:12px;min-width:0}
  .brand{font-size:16px;font-weight:700;letter-spacing:-.035em;white-space:nowrap}
  .brand::before{content:'';width:3px;height:19px;flex:none;background:var(--acc)}
  .product{color:var(--mut);border-left:1px solid var(--line);padding-left:12px;font-size:12px;font-weight:500;letter-spacing:.01em}
  .identity{justify-self:end;max-width:100%;color:var(--mut);font-size:12px}
  .identity #who{overflow-wrap:anywhere}.identity .pill{flex:none}
  #logout{background:transparent;border-color:var(--line)}
  .skip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:0;transform:translateY(-160%);z-index:10;background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:8px 12px}
  .skip:focus{top:max(8px,env(safe-area-inset-top,0px));transform:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .workspace{min-height:0;display:grid;grid-template-columns:184px minmax(0,1fr);grid-template-rows:minmax(0,1fr);column-gap:clamp(24px,3vw,40px)}
  #workspaceScroll,.login{min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-padding-block:12px}
  #workspaceScroll{position:relative;padding:28px 4px max(40px,env(safe-area-inset-bottom,0px))}
  #nav{min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;padding:27px 16px max(20px,env(safe-area-inset-bottom,0px)) 3px;border-right:1px solid var(--line)}
  .nav-group{display:grid;gap:3px}.nav-group+.nav-group{margin-top:25px}
  .nav-group .eyebrow{padding:0 11px 7px;font-size:10px;letter-spacing:.09em}
  nav button{background:transparent;border-color:transparent;color:var(--mut);text-align:left;font-weight:500}
  #nav button{padding:9px 11px;border-inline-start:2px solid transparent;white-space:nowrap;min-height:37px}
  nav button:not(:disabled):hover{background:var(--panel);border-color:transparent;color:var(--txt)}
  #nav button.on{background:var(--panel2);color:var(--txt);border-color:transparent;border-inline-start-color:var(--acc);font-weight:600}
  .section-head{border-bottom:1px solid var(--line);padding:0 0 20px;margin-bottom:22px}
  .section-head .eyebrow{margin-bottom:5px;color:var(--mut)}
  #view,.section-body,.card,.tscroll{min-width:0}
  .section-body,.record[open] .record-facts{animation:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:clamp(16px,2vw,24px);margin-bottom:16px}
  .card:last-child{margin-bottom:0}
  .card>p.mut{max-width:90ch}
  .card>p+button,.card>p+.grid2,.card>p+.row,.card>h2+.row,.withdrawal-review [role=status]:not(:empty),#queueStatus:not(:empty){margin-top:16px}
  .card>.row>div>.pill+p{margin-top:8px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:min(160px,100%)}
  .grid2,.directory-search,.control-form{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .directory-search,.control-form{margin-top:18px;align-items:end}
  .directory-search{grid-template-columns:minmax(0,2fr) minmax(0,1fr);padding-bottom:18px;border-bottom:1px solid var(--line)}
  .control-form{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}
  .control-form:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
  .control-form>button{justify-self:start;align-self:end}
  .control-form [role=status]{grid-column:1/-1}
  .control-form [role=status],.withdrawal-review [role=status]{color:var(--red);font-size:13px;overflow-wrap:anywhere}
  .control-form [role=status]:empty,.withdrawal-review [role=status]:empty,#limitsForm [role=status]:empty{display:none}
  #limitsForm{display:grid;gap:16px;margin:18px 0 0;max-width:680px}
  #limitsForm button{justify-self:start}
  #limitsForm [role=status]{font-size:13px;color:var(--red);overflow-wrap:anywhere}
  #s2fa .card{margin-top:16px;margin-bottom:0}
  #s2fa .card>p+p{margin-top:10px}
  #s2fa .row{margin-top:16px}
  #en_totp{max-width:260px;letter-spacing:.15em}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
  .stat{min-width:0;border-inline-start:1px solid var(--line);padding-inline-start:20px}
  .stat:first-child{border:0;padding-inline-start:0}
  .stat span{display:block;font-size:12px;font-weight:500;color:var(--mut)}
  .stat b{display:block;margin-top:9px;font-size:clamp(21px,2.1vw,28px);font-weight:600;line-height:1.3;letter-spacing:-.025em;overflow-wrap:anywhere;font-variant-numeric:lining-nums tabular-nums}
  .stat .ok{color:var(--grn)}.stat .warn{color:var(--acc)}
  .tscroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;margin-top:18px;border:1px solid var(--line);border-radius:5px;scroll-padding-inline:12px}
  .tscroll:focus-visible{outline-offset:2px}
  table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5;font-variant-numeric:lining-nums tabular-nums}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{background:var(--panel2);font-size:10px;font-weight:650;white-space:nowrap;padding-block:11px;letter-spacing:.055em}
  td{max-width:48ch}td.mono{overflow-wrap:anywhere}
  td small{display:block;margin-top:5px;color:var(--mut);font-size:11px;line-height:1.5}
  td button{white-space:nowrap}
  td input{min-height:34px;padding:6px 8px;font-size:12px}
  td input[data-conf],td input[data-min]{text-align:right}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#1c2630}
  td[colspan]{padding:26px 18px;text-align:left;color:var(--mut);font-size:13px;white-space:normal}
  .tscroll[aria-label='Credited totals'] table{min-width:340px}
  .tscroll[aria-label='Network configuration'] table{min-width:720px}
  .tscroll[aria-label='Asset configuration'] table{min-width:1020px}
  .tscroll[aria-label='Deposit ledger'] table{min-width:900px}
  .tscroll[aria-label='Audit log'] table{min-width:760px}
  .tscroll[aria-label='Credited totals'] :is(th,td):nth-child(n+2),.tscroll[aria-label='Daily settled bets'] :is(th,td):nth-child(n+2),.tscroll[aria-label='Recent deposits'] :is(th,td):nth-child(3),.tscroll[aria-label='Deposit ledger'] :is(th,td):nth-child(4){text-align:right}
  .audit-detail{min-width:24ch;max-width:56ch;overflow-wrap:anywhere}
  .pill{display:inline-block;vertical-align:middle;white-space:nowrap;font:550 11px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;border:1px solid #3c4a58;border-radius:4px;padding:2px 7px;background:var(--panel2);color:#acbac7;letter-spacing:0}
  .pill.ok{color:var(--grn);background:#20342d;border-color:#375549}
  .pill.warn{color:#d9c297;background:#332d25;border-color:#554a39}
  .pill.off{color:var(--mut);background:#202832;border-color:var(--line)}

  .user-row,.player-heading,.record-pager,.record summary,.record-facts div{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .user-row{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;padding:15px 10px;text-align:left;min-height:67px}
  .user-row:not(:disabled):hover{background:var(--panel2);border-color:var(--line)}
  .user-row:focus-visible{outline-offset:-2px}
  .user-row>span:first-child,.player-heading>div,.record summary>span{flex:1;min-width:0;overflow-wrap:anywhere}
  .user-row>span:last-child{flex:none;font-size:20px;font-weight:400;color:var(--mut)}
  .user-row small,.record small,.player-heading p{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:4px}
  .player-heading{margin:20px 0}.player-heading h2{font-size:23px}
  #playerTabs{display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;padding:3px 3px 8px;margin:0 0 16px;border-bottom:1px solid var(--line)}
  #playerTabs button{flex:none;white-space:nowrap;border-bottom:2px solid transparent;border-radius:4px 4px 0 0}
  #playerTabs .on{background:var(--panel2);color:var(--txt);border-inline-start:1px solid transparent;border-bottom-color:var(--acc)}
  #playerRecord>h3+label{margin-top:16px;margin-bottom:12px;max-width:360px}
  .record{border-bottom:1px solid var(--line);padding:0}
  .record summary{cursor:pointer;list-style:none;padding:15px 3px}
  .record summary::-webkit-details-marker{display:none}
  .record summary::after{content:'+';color:var(--mut);font:18px/1 ui-monospace,monospace;flex:none;width:14px;text-align:center}
  .record[open] summary::after{content:'-'}
  .record summary>b{max-width:52%;overflow-wrap:anywhere;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em}
  .record[open]>summary{border-bottom:1px solid var(--line)}
  .record>.control-form{padding-bottom:16px;margin-bottom:16px}
  .record>button{margin-bottom:16px}
  .record-pager{margin-top:18px;padding-top:14px;font-size:12px;color:var(--mut)}
  .record-pager span{text-align:center}.record-pager button{min-width:84px}
  .record-facts{margin:8px 0 22px}
  .record-facts div{align-items:flex-start;border-bottom:1px solid var(--line);padding:11px 0;font-size:12px}
  .record-facts dt,.withdrawal-review dt{color:var(--mut);font-weight:400;line-height:1.6}
  .record-facts dd{margin:0;text-align:right;max-width:65%;overflow-wrap:anywhere;line-height:1.6;font-variant-numeric:lining-nums tabular-nums}
  .pending-only{display:flex;align-items:center;gap:9px;max-width:none!important}
  .pending-only input{margin:0}
  .withdrawal-review h3{font-size:20px;line-height:1.5;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.015em}
  .withdrawal-review h3 .pill{margin-inline-start:6px}
  .withdrawal-review>p.mut{font-size:12px;margin-top:10px}
  .withdrawal-review dl{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px 18px;font-size:12px;margin:20px 0;padding-block:16px;border-block:1px solid var(--line)}
  .withdrawal-review dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .withdrawal-review dd button{min-height:32px;padding:5px 9px;margin-inline-end:4px}
  .withdrawal-review .row{margin-top:14px}
  .withdrawal-review .row>button{flex:0 1 auto;min-width:0}
  #refreshWithdrawals{margin-top:16px}

  .load-state,.empty-state,.load-error{padding:22px 18px;border:1px solid var(--line);border-radius:5px;background:#141c24;color:var(--mut);font-size:13px;line-height:1.65;overflow-wrap:anywhere}
  .load-state{display:flex;align-items:center;gap:10px}
  .load-state::before{content:'';width:6px;height:6px;flex:none;background:var(--focus);border-radius:50%}
  .empty-state{text-align:left}
  .load-error{border-inline-start:2px solid var(--red)}
  .load-error strong{color:var(--txt);font-weight:600}
  .load-error p{margin-top:5px}.load-error button{margin-top:14px}
  #directoryResults,.card>.empty-state,#playerStats{margin-top:18px}
  .toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - var(--left) - var(--right));width:max-content;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);font-size:13px;padding:12px 16px;border-radius:5px;z-index:20}
  .toast:empty{display:none}
  .login{height:100%;padding:clamp(28px,12vh,120px) var(--right) max(28px,env(safe-area-inset-bottom,0px)) var(--left);padding-top:max(clamp(28px,12svh,120px),env(safe-area-inset-top,0px))}
  .login-inner{max-width:420px;margin-inline:auto}.login .brand{margin-bottom:26px}
  .login .card{padding:clamp(24px,4vw,32px)}.login .eyebrow{margin-bottom:8px}
  .login h1{font-size:25px}.login h1+p{margin-top:10px}
  .login form{display:grid;gap:18px;margin-top:26px}
  .login .load-state{margin-top:22px}.login button{width:100%;min-height:42px;margin-top:4px}
  .login [role=alert]{color:var(--red);font-size:13px;overflow-wrap:anywhere}
  .login [role=alert]:not(:empty){margin-top:16px}

  .custody-head,.custody-actions{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
  .custody-head>div{min-width:0}.custody-head>button{flex:none}
  .custody-intro .eyebrow{margin-bottom:7px;color:var(--acc)}
  .custody-intro>p,.custody-block>p{margin-top:10px;max-width:88ch}
  .custody-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:16px 24px;margin:20px 0 0}
  .custody-facts div{min-width:0;border-top:1px solid var(--line);padding-top:12px}
  .custody-facts dt,.custody-detail small{color:var(--mut);font-size:12px;line-height:1.5}
  .custody-facts dd{margin:7px 0 0;font-size:13px;font-weight:550;line-height:1.6;overflow-wrap:anywhere;font-variant-numeric:lining-nums tabular-nums}
  .custody-address{display:block;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:12px 13px;margin:9px 0 0;color:#c7d3df;overflow-wrap:anywhere;user-select:all}
  .custody-form{display:grid;gap:16px;margin-top:18px}
  .custody-form .grid2{align-items:start}
  .custody-form .custody-actions{justify-content:flex-start;align-items:end}
  .custody-actions label{width:min(100%,200px)}
  .custody-form [role=status]{color:var(--red);font-size:13px;overflow-wrap:anywhere}
  .custody-form [role=status]:empty{display:none}
  .custody-form input[data-code]{letter-spacing:.12em}
  .custody-check{display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:400;line-height:1.6;color:#b5c2ce}
  .custody-check input{margin:2px 0 0}
  .custody-note{margin-top:18px;padding:13px 15px;border-inline-start:2px solid var(--line2);color:#acbac7;background:var(--bg);font-size:12px;line-height:1.7;overflow-wrap:anywhere}
  .custody-network{border-top:1px solid var(--line)}
  .custody-network:first-of-type{margin-top:22px}
  .custody-network>summary{cursor:pointer;display:grid;grid-template-columns:minmax(130px,1.4fr) minmax(120px,1fr) minmax(120px,1fr) 16px;gap:8px 18px;align-items:center;list-style:none;padding:18px 8px;min-height:85px}
  .custody-network>summary::-webkit-details-marker{display:none}
  .custody-network>summary::after{content:'+';color:var(--mut);font:20px/1 ui-monospace,monospace;text-align:center}
  .custody-network[open]>summary{border-bottom:1px solid var(--line);background:#1c2630}
  .custody-network[open]>summary::after{content:'-'}
  .custody-network>summary small,.custody-detail small{display:block;color:var(--mut)}
  .custody-network>summary .pill{margin-top:6px;min-width:76px;text-align:center}
  .custody-network>summary b{font-size:14px;font-weight:600}
  .custody-name small{margin-top:4px}
  .custody-detail{padding:0 4px 22px;min-width:0}
  .custody-detail p+p{margin-top:12px}
  .custody-block{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}
  .custody-block h3{font-size:14px}
  .custody-block>p+small{margin-top:16px}
  .custody-detail .tscroll{margin:16px 0 0}
  .custody-assets{min-width:580px}
  .custody-assets td:last-child{min-width:24ch;overflow-wrap:anywhere}
  .custody-edit>summary{cursor:pointer;color:#c5d0db;font-size:13px;font-weight:600;padding:10px 12px;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;background:#1c2630;border:1px solid var(--line);border-radius:4px}
  .custody-detail .mono{overflow-wrap:anywhere}
  .custody-jobs{min-width:800px}
  .custody-jobs small{display:block;color:var(--mut);margin-top:5px;max-width:30ch}
  .custody-jobs .mono{white-space:nowrap}
  .custody-jobs td:last-child{min-width:18ch;font-size:12px;line-height:1.55;color:var(--mut)}

  /* Shared picker CSS loads after this block; keep its focus treatment local and static. */
  body select.eb-option-trigger:focus,body select.eb-option-trigger:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus);box-shadow:none;animation:none;transition:none}
  body select.eb-option-trigger[aria-expanded=true]{border-color:var(--focus)}
  body dialog.eb-option-picker{--eb-accent:var(--focus);background:var(--panel);color:var(--txt);border-color:var(--line2);border-radius:6px;box-shadow:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}

<body>

<!-- LOGIN -->
<main id="login" class="login" aria-labelledby="loginTitle" tabindex="0">
  <div class="login-inner">
    <div class="brand">BANDITBLOX <span class="product">Treasury</span></div>
    <section class="card">
      <p class="eyebrow">Restricted access</p>
      <h1 id="loginTitle">Operator sign-in</h1>
      <p class="mut">Use your treasury operator credentials.</p>
      <p id="sessionCheck" class="load-state" role="status">Checking your session…</p>
      <form id="loginForm" method="post" hidden>
        <label>Operator username<input id="l_user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
        <label>Password<input id="l_pass" name="password" type="password" autocomplete="current-password" required></label>
        <label id="l_totp_wrap" hidden>Authenticator code<input id="l_totp" name="totp" inputmode="numeric" autocomplete="one-time-code"></label>
        <button class="pri" id="l_btn" type="submit">Sign in</button>
      </form>
      <p id="l_err" role="alert"></p>
    </section>
  </div>
</main>

<!-- APP -->
<div id="app" class="hide">
  <a class="skip" href="#sectionTitle">Skip to section</a>
  <header class="masthead">
    <div class="mast-inner">
      <div class="brand">BANDITBLOX <span class="product">Treasury</span></div>
      <div class="identity"><span id="who"></span><span class="pill" id="factor"></span></div>
      <button class="sm" id="logout">Log out</button>
    </div>
  </header>
  <div class="workspace">
    <nav id="nav" aria-label="Treasury sections">
      <div class="nav-group"><span class="eyebrow">Operations</span><button>Overview</button><button>Users</button><button>Withdrawals</button><button>Deposits</button><button>Sweeps</button></div>
      <div class="nav-group"><span class="eyebrow">Configuration</span><button>Direct wallets</button><button>Secrets</button><button>Chains</button><button>Assets</button><button>Settings</button></div>
      <div class="nav-group"><span class="eyebrow">Oversight</span><button>Security</button><button>Audit</button></div>
    </nav>
    <main id="workspaceScroll" aria-labelledby="sectionTitle" tabindex="0">
      <header class="section-head"><div><p class="eyebrow" id="sectionGroup"></p><h1 id="sectionTitle" tabindex="-1">Overview</h1><p id="sectionDescription"></p></div><div class="section-tools"><select id="sectionJump" aria-label="Jump to admin section"></select><button type="button" id="refreshSection" class="sm" aria-label="Refresh current section">Refresh</button></div></header>
      <p id="sectionStatus" class="sr-only" role="status"></p>
      <div id="view"></div>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
let toastT, session=0;
function toast(msg,ms=3500){const t=$('#toast');t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.textContent='',ms);}

async function api(path, method='GET', body){
  const started=session,custody=path==='/api/admin/custody'||path.startsWith('/api/admin/custody/');
  const r = await fetch(path, {
    method, credentials:'include',
    ...(custody?{mode:'same-origin',redirect:'error',cache:'no-store'}:{}),
    headers: body ? {'content-type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!r.ok){
    if(r.status===401 && started===session && !$('#app').classList.contains('hide')) showLogin('Your session expired. Sign in again.');
    if(custody){
      const alchemy=path==='/api/admin/custody/alchemy';
      const message=r.status===403?'Change not authorized. Verify operator 2FA and enter a fresh authenticator code.':r.status===429?'Too many attempts. Wait for a new authenticator code.':r.status===409?(alchemy?'Pause all network sweeps before changing the Alchemy API key.':'Configuration changed or there is an unresolved sweep. Refresh status before trying again.'):r.status===400?(alchemy?'The Alchemy API key format was rejected.':'The service rejected these settings. Check the public address and worker configuration.'):'Custody service unavailable. Refresh status before trying again.';
      throw Object.assign(new Error(message),{status:r.status});
    }
    // A proxy error for a credential write can contain the submitted value.
    if(path==='/api/admin/secrets' && method==='PUT'){
      const message=r.status===409?'Manage launch RPC configuration through Direct wallets.':r.status===400?'The secret was not saved. Check the network name and value; receiving keys must be watch-only.':'The secret could not be saved. Try again.';
      throw Object.assign(new Error(message),{status:r.status});
    }
    if(path==='/api/admin/2fa/enable' && method==='POST'){
      const message=r.status===429?'Too many attempts. Wait for a new authenticator code.':'Could not enable two-factor authentication. Enter a fresh six-digit authenticator code and try again.';
      throw Object.assign(new Error(message),{status:r.status});
    }
    const data=await r.json().catch(()=>({}));throw Object.assign(new Error(data.error || ('Error '+r.status)),{status:r.status});
  }
  if(custody && method!=='GET')return;
  return r.json().catch(()=>({}));
}

function showLogin(message=''){
  ++session;++userEpoch;clearTimeout(queueTimer);clearTimeout(searchTimer);clearTimeout(toastT);
  clearCustodyInputs();
  current='Overview';adminName='';playerId='';searchText='';directoryPage=recordsPage=queuePage=0;
  playerStatus=transactionType='all';pendingOnly=false;queueScope='open';
  $('#view').replaceChildren();$('#sectionStatus').textContent='';$('#who').textContent='';$('#toast').textContent='';
  $('#l_pass').value='';$('#l_totp').value='';$('#l_totp').required=false;$('#l_totp_wrap').hidden=true;
  $('#sessionCheck').hidden=true;$('#loginForm').hidden=false;clearFeedback($('#l_err'));$('#l_err').textContent=message;
  $('#app').classList.add('hide');$('#login').classList.remove('hide');document.title='Operator sign-in · BANDITBLOX Treasury';
  $('#l_user').focus();
}

// ---- Login ----
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const button=$('#l_btn');if(button.disabled)return;
  button.disabled=true;button.textContent='Signing in…';
  clearFeedback($('#l_err'));
  try{
    const body = { username:$('#l_user').value.trim(), password:$('#l_pass').value };
    const totp = $('#l_totp').value.trim(); if(totp) body.totp = totp;
    const res = await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const data = await res.json();
    if(!res.ok){
      if(data.need2fa){$('#l_totp_wrap').hidden=false;$('#l_totp').required=true;fieldError($('#l_err'),'Enter your authenticator code to continue.',[$('#l_totp')]);$('#l_totp').focus();return;}
      fieldError($('#l_err'),'Sign-in failed. Check your operator credentials and authenticator code.',$('#l_totp').required?[$('#l_totp')]:[$('#l_user'),$('#l_pass')]);return;
    }
    await boot(true);
  }catch{ fieldError($('#l_err'),'Could not sign in. Try again.'); }
  finally{button.disabled=false;button.textContent='Sign in';}
};
$('#l_user').oninput=()=>{clearFeedback($('#l_err'));$('#l_totp_wrap').hidden=true;$('#l_totp').required=false;$('#l_totp').value='';};
$('#logout').onclick = async () => {
  const button=$('#logout'),started=session;button.disabled=true;
  try{await api('/api/admin/logout','POST');if(started===session)showLogin();}
  catch(e){if(started===session)toast('Could not log out. '+e.message);}
  finally{button.disabled=false;}
};

// ---- Nav ----
const sections={Overview:renderOverview,Users:renderUsers,Withdrawals:renderWithdrawals,Deposits:renderDeposits,Sweeps:renderSweeps,
  'Direct wallets':renderDirectWallets,Secrets:renderSecrets,Chains:renderChains,Assets:renderAssets,Settings:renderSettings,Security:renderSecurity,Audit:renderAudit};
let current = 'Overview', adminName = '';
const sectionDescriptions={Overview:'Deposits, balances and activity across your treasury.',Users:'Find a player and review their balances, account access and activity.',Withdrawals:'Review requests and follow payouts through settlement.',Deposits:'Trace detected transfers, confirmation progress and credited balances.',Sweeps:'Monitor collections, transaction receipts and native fee reserves.','Direct wallets':'Manage receiving networks, collection destinations and worker readiness.',Secrets:'Manage encrypted service credentials and public wallet configuration.',Chains:'Review monitoring status and confirmation requirements by network.',Assets:'Control supported assets and their minimum deposits.',Settings:'Manage treasury preferences and game limits.',Security:'Manage operator authentication and account access.',Audit:'Review the record of administrative actions.'};
$('#sectionJump').innerHTML=Object.keys(sections).map(name=>`<option>${name}</option>`).join('');
$('#sectionJump').onchange=e=>openSection(e.target.value);
$('#refreshSection').onclick=()=>void render();
try{const initialSection=decodeURIComponent(location.hash.slice(1));if(Object.hasOwn(sections,initialSection))current=initialSection;}catch{}
const navPaths={Overview:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',Users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8m8-7a4 4 0 0 1 0 8m3 9v-2a4 4 0 0 0-3-4',Withdrawals:'M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5',Deposits:'M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4',Sweeps:'M3 7h17m-4-4 4 4-4 4M21 17H4m4-4-4 4 4 4','Direct wallets':'M20 7H5a2 2 0 0 1 0-4h13v4M3 6v14h18V7m0 5h-6v4h6',Secrets:'M14 10a5 5 0 1 0-5 5l3 3h3v3h4v-4l-6-6',Chains:'m10 13 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2 1 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0',Assets:'M20 7c0 3-16 3-16 0s16-3 16 0ZM4 7v10c0 3 16 3 16 0V7M4 12c0 3 16 3 16 0',Settings:'M4 7h16M4 17h16M8 4v6m8 4v6',Security:'m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Zm-4 10 3 3 5-6',Audit:'M7 3h13v18H4V6h3V3Zm1 6h8m-8 4h8m-8 4h5'};
for(const button of $('#nav').querySelectorAll('button'))button.insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${navPaths[button.textContent]||''}"/></svg>`);
function markCurrent(nav,name){
  for(const b of nav.querySelectorAll('button')){
    const selected=b.textContent===name;
    b.classList.toggle('on',selected);
    if(selected)b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  }
}
function openSection(name){
  if(!Object.hasOwn(sections,name))return;current=name;
  $('#sectionJump').value=name;$('#sectionDescription').textContent=sectionDescriptions[name];history.replaceState(null,'','#'+encodeURIComponent(name));
  markCurrent($('#nav'),current);$('#sectionGroup').textContent=$('#nav .on').parentElement.firstElementChild.textContent;
  $('#sectionTitle').textContent=current;document.title=current+' · BANDITBLOX Treasury';
  render();$('#workspaceScroll').scrollTop=0;$('#nav .on').scrollIntoView({block:'nearest',inline:'nearest'});
}
$('#nav').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.textContent==='Users'){playerId='';directoryPage=0;}
  openSection(b.textContent);
};
document.addEventListener('keydown',e=>{
  const nav=e.target.closest('nav');if(!nav||e.target.tagName!=='BUTTON'||e.altKey||e.ctrlKey||e.metaKey)return;
  const buttons=[...nav.querySelectorAll('button')],index=buttons.indexOf(e.target);
  const next={ArrowLeft:index-1,ArrowRight:index+1,Home:0,End:buttons.length-1};
  if(nav.id==='nav' && !matchMedia('(max-width:800px)').matches){next.ArrowUp=index-1;next.ArrowDown=index+1;}
  if(Object.hasOwn(next,e.key)){e.preventDefault();buttons[Math.max(0,Math.min(next[e.key],buttons.length-1))].focus();}
});

const fmt = (amt, dec) => { // integer minor units -> human string
  try{const n=BigInt(amt),abs=n<0n?-n:n,base=10n**BigInt(dec||0);
    const frac=(abs%base).toString().padStart(Number(dec),'0').replace(/0+$/,'');
    return (n<0n?'−':'')+(abs/base).toString()+(frac?'.'+frac:'');
  }catch{return amt;}
};
const short = s => s? (s.length>18?s.slice(0,8)+'…'+s.slice(-6):s) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setupAction=()=>'<button type="button" class="sm" data-open-section="Direct wallets">Review deposit setup</button>';
$('#view').addEventListener('click',e=>{const button=e.target.closest('[data-open-section]');if(button)openSection(button.dataset.openSection);});
let fieldErrorId=0;
function clearFieldError(field){
  const id=field.dataset.fieldError;if(!id)return;
  const descriptions=(field.getAttribute('aria-describedby')||'').split(/\s+/).filter(value=>value && value!==id);
  if(descriptions.length)field.setAttribute('aria-describedby',descriptions.join(' '));else field.removeAttribute('aria-describedby');
  field.removeAttribute('aria-invalid');delete field.dataset.fieldError;
}
function clearFeedback(status){
  if(!status)return;
  for(const field of document.querySelectorAll('[data-field-error]'))if(field.dataset.fieldError===status.id)clearFieldError(field);
  status.textContent='';
}
function fieldError(status,message,fields=[]){
  if(!status)return;
  clearFeedback(status);if(!status.id)status.id='admin-field-error-'+(++fieldErrorId);
  status.dataset.fieldFeedback='';status.textContent=message;
  for(const field of fields.filter(field=>field && !field.disabled)){
    const descriptions=new Set((field.getAttribute('aria-describedby')||'').split(/\s+/).filter(Boolean));descriptions.add(status.id);
    field.setAttribute('aria-describedby',[...descriptions].join(' '));field.setAttribute('aria-invalid','true');field.dataset.fieldError=status.id;
  }
}
function clearEditedError(e){
  const field=e.target,scope=field.form||field.closest?.('.card');
  const status=document.getElementById(field.dataset?.fieldError)||scope?.querySelector('[data-save-error],[data-field-feedback]')||field.closest?.('.card')?.querySelector('[data-field-feedback]');
  clearFeedback(status);
}
document.addEventListener('input',clearEditedError);document.addEventListener('change',clearEditedError);
document.addEventListener('invalid',e=>{
  const field=e.target,scope=field.form||field.closest('.card'),status=scope?.querySelector('[data-save-error],[role=status],[role=alert]')||field.closest('.card')?.querySelector('[role=alert]');
  if(status)fieldError(status,'Check the highlighted fields before continuing.',[...scope.querySelectorAll('input,select,textarea')].filter(input=>input.willValidate && !input.validity.valid));
},true);
const loading=label=>`<p role="status" class="load-state">Loading ${esc(label)}…</p>`;
function loadError(host,label,error,retry){
  if(!host.isConnected)return;
  $('#sectionStatus').textContent='';
  host.innerHTML=`<div class="load-error"><div role="alert"><strong>Could not load ${esc(label)}.</strong><p>${esc(error.message)}</p></div><button type="button" data-retry>Try again</button></div>`;
  host.querySelector('[data-retry]').onclick=retry;
}

const hexAddress=v=>typeof v==='string' && /^0x[\da-f]{40}$/i.test(v) && !/^0x0{40}$/i.test(v);
const publicDestination=(id,v)=>id==='SOL'?typeof v==='string' && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(v) && v!=='1'.repeat(32):hexAddress(v);

async function custodyPublicKey(info){
  if(!custodySecure() || !/^[\da-f]{64}$/.test(info.id) || typeof info.spki!=='string' || info.spki.length>8192)return null;
  try{
    const der=Uint8Array.from(atob(info.spki),c=>c.charCodeAt(0));
    const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',der));
    if(Array.from(digest,b=>b.toString(16).padStart(2,'0')).join('')!==info.id)return null;
    const key=await crypto.subtle.importKey('spki',der,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
    return key.algorithm.modulusLength===3072?key:null;
  }catch{return null;}
}

// Never name or serialize the seed input. Only the worker-key envelope crosses the API boundary.
function readCustodySeed(input){
  const hex=input.value;input.value='';
  if(hex.length!==64 || !/^[\da-f]+$/i.test(hex))return null;
  const raw=new Uint8Array(32);
  for(let i=0;i<raw.length;i++)raw[i]=parseInt(hex.slice(i*2,i*2+2),16);
  return raw;
}

        const raw=readCustodySeed(form.querySelector('#custodySeed'));
        if(!raw){fieldError(status,'Enter exactly 64 hexadecimal characters from your dedicated offline seed.',[form.querySelector('#custodySeed')]);return;}
        let sealed;
        try{
          if(!form.querySelector('#custodyBackup').checked){fieldError(status,'Verify the offline seed backup and the worker key ID before enrollment.',[form.querySelector('#custodyBackup')]);return;}
          if(!/^\d{6}$/.test(totp)){fieldError(status,'Enter a fresh six-digit authenticator code.',[code]);return;}
          try{sealed=await crypto.subtle.encrypt({name:'RSA-OAEP',label:new TextEncoder().encode(key.id)},pub,raw);}

        }finally{raw.fill(0);}
        if(!form.isConnected)return;

        if(!/^\d{6}$/.test(totp)){fieldError(status,'Enter a fresh six-digit authenticator code.',[code]);return;}
        const payload={api_key:removing?null:apiKey,totp};try{await api('/api/admin/custody/drpc','PUT',payload);success=removing?'dRPC API key removed.':'dRPC API key saved.';}finally{payload.api_key=null;apiKey='';}
      }else if(form.id==='alchemyKeyAddForm'){

        if(!/^[\x21-\x7E]{8,128}$/.test(apiKey)){fieldError(status,'Enter an Alchemy API key using 8–128 visible ASCII characters without spaces.',[form.querySelector('[data-alchemy-add-key]')]);return;}
        if(!/^\d{6}$/.test(totp)){fieldError(status,'Enter a fresh six-digit authenticator code.',[code]);return;}
        const payload={api_key:apiKey,totp};try{await api('/api/admin/custody/alchemy/keys','POST',payload);success='Alchemy fallback key added.';}finally{payload.api_key=null;apiKey='';}
      }else if(form.id==='alchemyRpcForm'){
        let apiKey=form.querySelector('[data-alchemy-key]').value.trim();
        form.querySelector('[data-alchemy-key]').value='';
        const removing=form.dataset.remove==='true';delete form.dataset.remove;
        if(!removing && !/^[\x21-\x7E]{8,128}$/.test(apiKey)){apiKey='';fieldError(status,'Enter an Alchemy API key using 8–128 visible ASCII characters without spaces.',[form.querySelector('[data-alchemy-key]')]);return;}
        if(!/^\d{6}$/.test(totp)){apiKey='';fieldError(status,'Enter a fresh six-digit authenticator code.',[code]);return;}
        const payload={api_key:removing?null:apiKey,totp};
        try{await api('/api/admin/custody/alchemy','PUT',payload);success=removing?'Alchemy API key removed. Scanner readiness must be re-established.':'Alchemy API key saved. Scanner readiness must be re-established.';}
        finally{payload.api_key=null;apiKey='';}
      }else{
        const body={totp};
        if(form.hasAttribute('data-network-settings')){
          const dest=form.querySelector('[data-destination]').value.trim();
          if(!dest){fieldError(status,'Enter the public collection address for this network.',[form.querySelector('[data-destination]')]);return;}
          if(dest){if(n.destination_locked || !publicDestination(id,dest) || (fee && dest.toLowerCase()===fee.toLowerCase())){fieldError(status,'Enter a valid, unlocked public collection address for this network, not the fee sponsor.',[form.querySelector('[data-destination]')]);return;}body.destination=dest;}
          success='Collection address saved. Sweep activation is separate.';
        }else{
          body.enabled=!n.sweeps_enabled;

        }
        if(!/^\d{6}$/.test(totp)){fieldError(status,'Enter a fresh six-digit authenticator code.',[code]);return;}
        await api('/api/admin/custody/networks/'+id,'PUT',body);
      }
      if(form.isConnected){toast(success);await refresh(id);}
    }catch(err){if(form.isConnected)fieldError(status,err.status?err.message:'Could not confirm the change. Refresh status before trying again.',[403,429].includes(err.status)?[code]:err.status===400 && form.id==='alchemyRpcForm'?[form.querySelector('[data-alchemy-key]')]:err.status===400 && form.hasAttribute('data-network-settings')?[form.querySelector('[data-destination]')]:[]);}
    finally{button.disabled=false;}
  };
}

let queueScope='open',queuePage=0,queueTimer;
async function renderWithdrawals(v, data){
  const path='/api/admin/withdrawals?scope='+queueScope+'&page='+queuePage;
  const {rows,more}=data||await api(path);
  if(!v.isConnected || current!=='Withdrawals')return;
  v.innerHTML=`<div class="card"><h2>${queueScope==='open'?'Withdrawal queue':'Completed withdrawals'}</h2><p class="mut">Review the destination and amount, approve the request, then record the transaction after broadcasting.</p><button id="queueMode"></button> <button id="refreshWithdrawals">Refresh</button><p id="queueStatus" class="mut" role="status"></p></div>`;
  for(const w of rows){
    const own=w.reviewer===adminName;
    v.insertAdjacentHTML('beforeend',`<section class="card withdrawal-review" data-id="${esc(w.id)}">
      <h3>${esc(fmt(w.amount,w.decimals))} ${esc(w.symbol)} <span class="pill">${esc(w.chain_id)}</span></h3>
      <p class="mut"><span class="pill ${w.status==='sent'?'ok':queueScope==='open'?'warn':'off'}">${esc(w.status)}</span> · ${esc(new Date(w.created_at).toLocaleString())}${w.reviewer?' · '+esc(w.reviewer):''}</p>
      <dl><dt>Destination</dt><dd class="mono">${esc(w.destination)}</dd><dt>Request</dt><dd class="mono">${esc(w.id)}</dd><dt>Player</dt><dd><button data-owner="${esc(w.user_id)}">${esc(w.username)}</button> · ${esc(w.email)}</dd><dt>Player ID</dt><dd class="mono">${esc(w.user_id)}</dd>${w.txid?`<dt>Transaction ID</dt><dd class="mono">${esc(w.txid)}</dd>`:''}</dl>
      ${w.status==='requested'?'<button class="pri" data-w="review">Claim for review</button>':own && w.status==='reviewing'?'<button class="pri" data-w="approve">Approve withdrawal</button> <button data-w="return">Return funds to player</button>':own && w.status==='approved'?`<label>Broadcast transaction ID<input name="txid" autocomplete="off" spellcheck="false" maxlength="100"></label>
      <div class="row"><button class="pri" data-w="sent">Record as sent</button><button data-w="return">Return funds to player</button></div>`:''}
      <p class="mut" role="status"></p></section>`);
  }
  if(!rows.length)v.insertAdjacentHTML('beforeend','<p class="empty-state">'+(queueScope==='open'?'No withdrawals awaiting review.':'No completed withdrawals.')+'</p>');
  $('#queueMode').textContent=queueScope==='open'?'View completed withdrawals':'View open requests';
  $('#queueMode').onclick=()=>{queueScope=queueScope==='open'?'history':'open';queuePage=0;render();};
  v.insertAdjacentHTML('beforeend',pageButtons(queuePage,more));
  v.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{queuePage+=Number(b.dataset.step);render();});
  v.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{playerId=b.dataset.owner;playerTab='Overview';openSection('Users');});
  $('#refreshWithdrawals').onclick=render;
  const previous=JSON.stringify({rows,more}),queueStatus=v.querySelector('#queueStatus');
  async function watchQueue(){
    if(!v.isConnected)return;
    try{
      if(!document.hidden){
        const next=await api(path);
        if(!v.isConnected)return;
        if(queueStatus.textContent)queueStatus.textContent='';
        if(JSON.stringify(next)!==previous){
          const drafts=new Map([...v.querySelectorAll('[name=txid]')].map(f=>[f.closest('[data-id]').dataset.id,f.value]));
          const focused=document.activeElement?.closest('[name=txid]')?.closest('[data-id]')?.dataset.id;
          await renderWithdrawals(v,next);
          v.querySelectorAll('[name=txid]').forEach(f=>{
            const id=f.closest('[data-id]').dataset.id;
            if(drafts.has(id))f.value=drafts.get(id);
            if(id===focused)f.focus({preventScroll:true});
          });
          return;
        }
      }
    }catch{if(v.isConnected && !queueStatus.textContent)queueStatus.textContent='Refresh failed. Showing the last received queue; retrying automatically.';}
    if(v.isConnected)queueTimer=setTimeout(watchQueue,4000);
  }
  queueTimer=setTimeout(watchQueue,4000);
  for(const card of v.querySelectorAll('.withdrawal-review')){
    card.onclick=async e=>{
      const button=e.target.closest('[data-w]');
      if(!button)return;
      const action=button.dataset.w, txid=card.querySelector('[name=txid]')?.value.trim();
      const status=card.querySelector('[role=status]');clearFeedback(status);
      if(action==='sent' && !txid){fieldError(status,'Enter the transaction ID from the sending wallet.',[card.querySelector('[name=txid]')]);return;}
      if(action==='return' && !confirm('Return this reserved amount to the player?'))return;
      if(action==='sent' && !confirm('Record the broadcast transaction and settle this withdrawal?'))return;
      button.disabled=true;
      try{await api('/api/admin/withdrawals/'+card.dataset.id,'POST',{action,txid:action==='sent'?txid:undefined});if(v.isConnected)await render();}
      catch(err){fieldError(status,err.message,action==='sent'?[card.querySelector('[name=txid]')]:[]);button.disabled=false;}
    };
  }
}

let playerId='',playerTab='Overview',directoryPage=0,recordsPage=0,searchText='',playerStatus='all',pendingOnly=false,userEpoch=0;

function pageButtons(index,more){return `<div class="record-pager" role="group" aria-label="Pagination"><button data-step="-1" ${index?'':'disabled'}>Previous</button><span>Page ${index+1}</span><button data-step="1" ${more?'':'disabled'}>Next</button></div>`;}
function renderUsers(v){
  if(!playerId){
    v.innerHTML=`<div class="card"><h2>Registered users</h2><div class="directory-search"><label>Find a player<input id="playerSearch" type="search" placeholder="Email, username or account ID" value="${esc(searchText)}" maxlength="200"></label><label>Account status<select id="playerStatus">${['all','active','suspended','banned'].map(st=>`<option ${st===playerStatus?'selected':''}>${st}</option>`).join('')}</select></label></div><div id="directoryResults" role="region" aria-label="Search results" tabindex="-1"></div></div>`;
    const host=v.querySelector('#directoryResults');
    function search(delay=0){
      const turn=++userEpoch;clearTimeout(searchTimer);
      if(host.contains(document.activeElement))host.focus({preventScroll:true});
      if(!host.querySelector('.load-state')){host.setAttribute('aria-busy','true');host.innerHTML=loading('users');$('#sectionStatus').textContent='Searching the directory…';}
      async function fetchRows(){
        try{
          const d=await api('/api/admin/users?'+new URLSearchParams({q:searchText,status:playerStatus,page:String(directoryPage)}));
          if(turn!==userEpoch)return;
          host.innerHTML=(d.rows.map(u=>`<button class="user-row" data-player="${esc(u.id)}"><span><b>${esc(u.username)}</b><small>${esc(u.email)}</small></span><span class="pill ${u.status==='active'?'ok':'warn'}">${esc(u.status)}</span><span aria-hidden="true">›</span></button>`).join('')||'<div class="empty-state"><p>No matching users.</p>'+(searchText || playerStatus!=='all' || directoryPage?'<button type="button" class="sm" data-clear-users>Clear directory filters</button>':'')+'</div>')+pageButtons(directoryPage,d.more);
          $('#sectionStatus').textContent=d.rows.length+' '+(d.rows.length===1?'result':'results')+' on page '+(directoryPage+1)+'.';
        }catch(err){if(turn===userEpoch)loadError(host,'users',err,()=>search());}
        finally{if(turn===userEpoch)host.setAttribute('aria-busy','false');}
      }
      if(delay)searchTimer=setTimeout(fetchRows,delay);else fetchRows();
    }
    host.onclick=e=>{const item=e.target.closest('[data-player]'),step=e.target.closest('[data-step]');if(e.target.closest('[data-clear-users]')){searchText='';playerStatus='all';directoryPage=0;$('#playerSearch').value='';$('#playerStatus').value='all';search();$('#playerSearch').focus({preventScroll:true});}else if(item){playerId=item.dataset.player;playerTab='Overview';recordsPage=0;render();}else if(step){directoryPage+=Number(step.dataset.step);search();}};
    $('#playerSearch').oninput=e=>{searchText=e.target.value;directoryPage=0;search(160);};
    $('#playerStatus').onchange=e=>{playerStatus=e.target.value;directoryPage=0;search();};
    search();return;
  }
  const root=playerPath();
  v.innerHTML=`<button class="sm" id="backUsers">← All users</button><header class="player-heading"><div><h2>Player record</h2><p></p></div><span class="pill" hidden></span></header>
    <nav id="playerTabs" aria-label="Player records">${playerTabs.map(t=>`<button>${t}</button>`).join('')}</nav><section id="playerRecord" class="card" aria-label="Player record" tabindex="-1"></section>`;
  const tabs=v.querySelector('#playerTabs'),host=v.querySelector('#playerRecord');
  async function loadTab(){
    const seq=++userEpoch,label='player '+playerTab.toLowerCase();
    const field=host.contains(document.activeElement)?document.activeElement.id:null;
    if(field!==null)host.focus({preventScroll:true});
    markCurrent(tabs,playerTab);$('#sectionStatus').textContent='';host.innerHTML=loading(label);
    try{
      const d=await api(root);if(seq!==userEpoch)return;
      const heading=v.querySelector('.player-heading'),badge=heading.querySelector('.pill');
      heading.querySelector('h2').textContent=d.user.username;heading.querySelector('p').textContent=d.user.email;
      badge.hidden=false;badge.textContent=d.user.status;badge.className='pill '+(d.user.status==='active'?'ok':'warn');
      await renderPlayerRecord(host,root,d,seq,loadTab);
      if(seq===userEpoch && field && document.activeElement===host)document.getElementById(field)?.focus({preventScroll:true});
    }catch(err){if(seq===userEpoch)loadError(host,label,err,loadTab);}
  }
  $('#backUsers').onclick=()=>{playerId='';render();$('#playerSearch').focus();};
  tabs.onclick=e=>{const b=e.target.closest('button');if(b){playerTab=b.textContent;recordsPage=0;transactionType='all';loadTab();}};
  loadTab();

async function renderPlayerRecord(host,root,d,seq,loadTab){

    const label=r.game||r.kind||r.action||(r.provider==='archived'?'Archived payment':r.chain_id);
    return `<details class="record"><summary><span><b>${esc(label)}</b><small>${esc(time)} · ${esc(r.status||r.withdrawal_status||'')}</small></span><b>${esc(quantity)}</b></summary>
      ${facts([['ID',r.id],['Reference',r.ref||r.track_id],['Status',r.status],['Network',r.chain_id],['Destination',r.address||r.destination],['Transaction ID',r.txid],['Confirmations',r.required_conf!=null?r.confirmations+' / '+r.required_conf:null],['Credit held',r.review_hold!=null?(r.review_hold?'Yes':'No'):null],['Payout',r.payout!=null?fmt(r.payout,r.decimals):null],['Reviewer',r.reviewer],['Operator',r.actor],['Reason',r.reason],['Details',r.details?JSON.stringify(r.details):null],['Journal',r.journal_id]])}
      ${key==='bets'?`<button class="sm" data-bet-detail="${i}">View game result</button><div class="game-facts"></div>`:''}
      ${key==='deposits'&&r.provider==='direct'&&['pending','confirmed'].includes(r.status)?`<form class="control-form" data-deposit-action><input type="hidden" name="deposit" value="${esc(r.id)}"><input type="hidden" name="action" value="${r.review_hold?'release_deposit':'hold_deposit'}"><label>Review reason<input required name="reason" maxlength="300"></label><button>${r.review_hold?'Release review hold':'Hold credit for review'}</button><p role="status"></p></form>`:''}</details>`;
  }).join('')||`<div class="empty-state"><p role="status">No ${key==='actions'?'audit entries':key} for this selection.</p>${recordsPage || (key==='deposits' && pendingOnly) || (key==='transactions' && transactionType!=='all')?'<button type="button" class="sm" data-clear-records>Reset record filters</button>':''}</div>`)+pageButtons(recordsPage,records.more);
  host.querySelector('[data-clear-records]')?.addEventListener('click',()=>{recordsPage=0;transactionType='all';pendingOnly=false;loadTab();});
  if($('#adminTransactionType'))$('#adminTransactionType').onchange=e=>{transactionType=e.target.value;recordsPage=0;loadTab();};
  if($('#pendingDeposits'))$('#pendingDeposits').onchange=e=>{pendingOnly=e.target.checked;recordsPage=0;loadTab();};
  host.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{recordsPage+=Number(b.dataset.step);loadTab();});
  host.querySelectorAll('[data-deposit-action]').forEach(f=>wireControl(f,root,u.username));
  host.querySelectorAll('[data-bet-detail]').forEach(b=>b.onclick=async()=>{const row=records.rows[Number(b.dataset.betDetail)],el=b.nextElementSibling;
    try{const bet=await api(root+'/bets/'+encodeURIComponent(row.game)+'/'+encodeURIComponent(row.id));el.innerHTML=facts(Object.entries(bet.detail).map(([k,v])=>[k,typeof v==='object'&&v!==null?JSON.stringify(v):v]));b.hidden=true;}catch(err){el.textContent=err.message;}});
}
function operationId(){
  const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
}
function wireControl(form,root,name){
  let request=operationId();
  form.oninput=()=>{request=operationId();};
  form.onsubmit=async e=>{
    e.preventDefault();const values=Object.fromEntries(new FormData(form)),status=form.querySelector('[role=status]');clearFeedback(status);
    if(values.until)values.until=new Date(values.until).toISOString();
    const info=[values.action,name,values.amount,values.asset,values.until,values.deposit,values.reason].filter(Boolean).join(' · ');
    if(!confirm('Confirm this change?\n'+info))return;
    const button=form.querySelector('button');button.disabled=true;
    try{await api(root+'/actions','POST',{...values,request});if(form.isConnected){toast('Change recorded');await render();}}
    catch(err){fieldError(status,err.message,[...form.querySelectorAll('input:not([type=hidden]),select,textarea')]);button.disabled=false;}
  };
}

async function renderSettings(v){
  const [d,limits] = await Promise.all([api('/api/admin/settings'),api('/api/admin/bet-limits')]);
  if(!v.isConnected)return;
  const paused=d.deposits_paused,issuancePaused=d.issuance_paused??paused,providerPaused=d.provider_paused===true;
  v.innerHTML=`<section class="card"><h2>Direct deposits</h2><p class="mut">Players choose a coin and network to receive a permanent wallet address. There is no amount-entry or external checkout step. Configure the signer, RPCs and collection wallets in <button type="button" class="sm" id="openDirectWallets">Direct wallets</button>.</p>
    <div class="row"><div><span class="pill ${issuancePaused?'warn':'ok'}">${issuancePaused?'Paused':'New deposit requests enabled'}</span><p class="mut">${providerPaused?'RPC failover is rebuilding fresh scanner checkpoints. New addresses will resume automatically when the scanners are current.':paused?'Your manual pause stops new address requests. Previously issued addresses remain monitored and eligible transfers can still confirm and credit.':'Previously issued addresses remain monitored and eligible transfers can still confirm and credit.'}</p></div>
    <div style="flex:0 0 auto"><button class="${paused?'pri':'danger'}" id="pauseBtn">${paused?'Resume deposits':'Pause deposits'}</button></div></div></section>
    <section class="card"><h2>Wager limits</h2><p class="mut">Limits apply across paid games in USDT at the market rate when a stake is accepted. Additional stakes count toward the maximum for the hand.</p>
      <form id="limitsForm"><div class="grid2"><label>Minimum bet (USDT)<input name="minimum" inputmode="decimal" required value="${esc(limits.min_usdt)}"></label>
      <label>Maximum bet (USDT)<input name="maximum" inputmode="decimal" value="${esc(limits.max_usdt??'')}" placeholder="No maximum"></label></div><button type="submit" class="pri">Save wager limits</button><span role="status" class="warn" data-save-error></span></form></section>`;
  $('#openDirectWallets').onclick=()=>openSection('Direct wallets');
  $('#pauseBtn').onclick=e=>updateControl(e.currentTarget,()=>api('/api/admin/settings','PATCH',{key:'deposits_paused',value:!paused}),paused?'Deposits resumed':'New deposits paused');
  $('#limitsForm').onsubmit=e=>{e.preventDefault();const f=e.target;updateControl(f.querySelector('button'),()=>api('/api/admin/bet-limits','PUT',{min_usdt:f.elements.minimum.value.trim(),max_usdt:f.elements.maximum.value.trim()||null}),'Wager limits saved');};
}

function showFactor(enabled){const badge=$('#factor');badge.textContent=enabled?'2FA on':'2FA off';badge.className='pill '+(enabled?'ok':'warn');}
async function renderSecurity(v){
  const me = await api('/api/admin/me');
  if(!v.isConnected)return;
  showFactor(me.totp_enabled);
  v.innerHTML = `<div class="card"><h2>Two-factor authentication</h2>
    <p class="mut">Authenticator verification is ${me.totp_enabled?'<span class="pill ok">enabled</span>':'<span class="pill warn">not enabled</span>'} for this operator.</p>
    ${me.totp_enabled?'':`<button class="pri" id="setup2fa">Set up 2FA</button><div id="s2fa" style="margin-top:12px"></div>`}
  </div>`;
  if(!me.totp_enabled) $('#setup2fa').onclick = async e => {
    const button=e.currentTarget;button.disabled=true;
    let d;
    try{d=await api('/api/admin/2fa/setup','POST');}
    catch(err){if(v.isConnected)toast(err.message,6000);return;}
    finally{button.disabled=false;}
    if(!v.isConnected)return;
    $('#s2fa').innerHTML = `<div class="card" style="background:var(--panel2)">
      <p class="mut" style="font-size:13px">Add this to your authenticator app, then enter a code to confirm.</p>
      <p><b>Secret:</b> <span class="mono">${esc(d.secret)}</span></p>
      <p class="mono mut" style="word-break:break-all;font-size:11px">${esc(d.uri)}</p>
      <div class="row" style="align-items:flex-end"><div style="flex:1"><label for="en_totp">Code</label><input id="en_totp" inputmode="numeric" autocomplete="one-time-code"></div><div style="flex:0 0 auto"><button class="pri" id="en_btn">Enable</button></div></div><p role="status" data-save-error></p>
    </div>`;
    $('#en_totp').focus();
    $('#en_btn').onclick=e=>{const input=$('#en_totp');if(!/^\d{6}$/.test(input.value.trim())){fieldError(e.currentTarget.closest('.card').querySelector('[data-save-error]'),'Enter a fresh six-digit authenticator code.',[input]);return;}updateControl(e.currentTarget,()=>api('/api/admin/2fa/enable','POST',{totp:input.value.trim()}),'2FA enabled');};
  };
}

async function renderAudit(v){
  const d = await api('/api/admin/audit');
  if(!v.isConnected)return;
  v.innerHTML = `<div class="card"><h2>Audit log</h2><div class="tscroll" tabindex="0" role="region" aria-label="Audit log"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th><th>IP</th></tr></thead><tbody>
    ${d.audit.map(a=>`<tr><td class="mut">${new Date(a.created_at).toLocaleString()}</td><td>${esc(a.actor)}</td><td class="mono">${esc(a.action)}</td><td class="mono mut audit-detail">${esc(JSON.stringify(a.detail))}</td><td class="mono mut">${esc(a.ip||'')}</td></tr>`).join('')||'<tr><td colspan=5 class=mut>No audit entries yet.</td></tr>'}
  </tbody></table></div></div>`;
}

async function boot(fromLogin=false){
  try{
    const me = await api('/api/admin/me');
    ++session;adminName=me.username;$('#who').textContent=me.username;showFactor(me.totp_enabled);
    $('#l_pass').value='';$('#l_totp').value='';$('#login').classList.add('hide');$('#app').classList.remove('hide');
    openSection(current);if(fromLogin)$('#nav .on').focus();
  }catch(e){showLogin(e.status===401&&!fromLogin?'':'Could not verify your session. '+e.message);}
}
boot();
</script>
